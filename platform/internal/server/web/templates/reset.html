{{ define "content" }}
<div class="auth-split">
  <div class="auth-split-form">
    <div class="auth-split-form-inner">
      <a href="/" class="brand auth-brand">Gamify<span>Dev</span></a>
      <h1>Choose a new password</h1>
      <p class="muted">At least 8 characters. Signing in everywhere else will end.</p>
      {{ if .Flash }}<div class="flash">{{ .Flash }}</div>{{ end }}
      <form method="post" action="/reset/{{ index .Data "token" }}" class="form">
        <label class="field">
          <span>New password</span>
          <input type="password" name="password" required autofocus minlength="8" />
        </label>
        <label class="field">
          <span>Confirm it</span>
          <input type="password" name="confirm" required minlength="8" />
        </label>
        <button type="submit" class="btn btn-primary btn-block auth-submit">
          <span class="auth-submit-text">Set my password</span>
          <span class="auth-submit-spinner" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </div>
  <div class="auth-split-visual">
    <div class="auth-split-overlay">
      <div class="auth-split-cta">
        <h2>Almost there.</h2>
        <p>Pick something you'll remember this time.</p>
      </div>
    </div>
  </div>
</div>
{{ end }}
