{{ define "content" }}
{{ $c := index .Data "course" }}
{{ $l := index .Data "lesson" }}
<div class="page-head">
  <a class="back" href="/admin/courses/{{ $c.ID }}">← {{ $c.Title }}</a>
  <h1>{{ if $l }}Edit lesson{{ else }}New lesson{{ end }}</h1>
</div>
<div class="card">
  <form method="post" action="{{ index .Data "action" }}" class="form">
    <div class="form-row">
      <label class="field"><span>Title</span>
        <input name="title" value="{{ if $l }}{{ $l.Title }}{{ end }}" required autofocus /></label>
      <label class="field"><span>Slug <span class="muted">(optional)</span></span>
        <input name="slug" value="{{ if $l }}{{ $l.Slug }}{{ end }}" placeholder="auto from title" /></label>
    </div>
    <label class="field"><span>Summary</span>
      <input name="summary" value="{{ if $l }}{{ $l.Summary }}{{ end }}" placeholder="One-line description" /></label>
    <div class="form-row">
      <label class="field"><span>Video URL <span class="muted">(optional)</span></span>
        <input name="video_url" value="{{ if $l }}{{ $l.VideoURL }}{{ end }}" placeholder="https://..." /></label>
      <label class="field"><span>Audio URL <span class="muted">(optional)</span></span>
        <input name="audio_url" value="{{ if $l }}{{ $l.AudioURL }}{{ end }}" placeholder="https://..." /></label>
    </div>
    <div class="field">
      <span>Body <span class="muted">— markdown; supports images, code, and :::tip / :::analogy / :::quiz blocks</span></span>
      <gd-markdown-editor endpoint="/admin/lessons/preview">
        <textarea slot="editor" name="body" rows="18" class="code-area md-input">{{ if $l }}{{ $l.Body }}{{ end }}</textarea>
        <div slot="preview" class="prose md-preview"></div>
      </gd-markdown-editor>
    </div>
    <button class="btn btn-primary" type="submit">{{ if $l }}Save changes{{ else }}Create lesson{{ end }}</button>
  </form>
</div>
<script type="module" src="/static/js/markdown-editor.js"></script>
{{ end }}
