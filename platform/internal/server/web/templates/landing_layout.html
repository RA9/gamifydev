<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>
            {{ if .Title }}{{ .Title }} · {{ end }}GamifyDev — Learn to code by
            building
        </title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <meta
            name="description"
            content="A free, structured computer science program with placement, cohorts, and real coding checkpoints."
        />
        <meta name="theme-color" content="#ffffff" />
        <link rel="stylesheet" href="/static/css/app.css" />
    </head>
    <body class="landing {{ index .Data "bodyClass" }}">
        {{ template "site_header" . }}

        <main class="lp-main">{{ block "content" . }}{{ end }}</main>

        {{ template "site_footer" . }}
    </body>
</html>
