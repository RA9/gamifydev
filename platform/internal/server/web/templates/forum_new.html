{{ define "content" }}
<div class="card" style="max-width:680px;margin:0 auto;">
  <a class="back" href="/forum">← Forum</a>
  <h1 style="margin:.2em 0 0;">Start a discussion</h1>
  <p class="muted">Markdown is supported in the body.</p>
  <form method="post" action="/forum" class="form">
    <label class="field">
      <span>Title</span>
      <input type="text" name="title" value="{{ index .Data "title" }}" required autofocus />
    </label>
    <label class="field">
      <span>Category</span>
      <select name="category" class="role-select">
        {{ range index .Data "categories" }}<option value="{{ . }}">{{ . }}</option>{{ end }}
      </select>
    </label>
    <label class="field">
      <span>Body</span>
      <textarea name="body" rows="10" required placeholder="What's on your mind?">{{ index .Data "body" }}</textarea>
    </label>
    <button class="btn btn-primary" type="submit">Post discussion</button>
  </form>
</div>
{{ end }}
