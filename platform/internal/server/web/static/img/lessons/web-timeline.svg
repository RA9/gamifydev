<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="A timeline of the web: 1989 the idea, 1991 first website, 1993 Mosaic browser, 2004 social web, 2007 mobile web, and today apps everywhere.">
  <defs>
    <style>
      .lbl { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 800; }
      .yr  { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 900; }
    </style>
  </defs>
  <rect x="2" y="2" width="756" height="246" rx="24" fill="#f7f7fd" stroke="#e7e5ff" stroke-width="2"/>
  <text x="380" y="40" text-anchor="middle" class="lbl" font-size="22" fill="#475569">A short history of the web</text>

  <!-- timeline -->
  <line x1="60" y1="125" x2="700" y2="125" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <g text-anchor="middle">
    <!-- 1989 -->
    <circle cx="60" cy="125" r="11" fill="#6740e8"/>
    <text x="60" y="100" class="yr" font-size="18" fill="#4c1d95">1989</text>
    <text x="60" y="156" class="lbl" font-size="13" fill="#334155">The idea</text>
    <text x="60" y="173" class="lbl" font-size="11" fill="#94a3b8">Berners-Lee</text>

    <!-- 1991 -->
    <circle cx="188" cy="125" r="11" fill="#58cc02"/>
    <text x="188" y="100" class="yr" font-size="18" fill="#377e06">1991</text>
    <text x="188" y="156" class="lbl" font-size="13" fill="#334155">First website</text>
    <text x="188" y="173" class="lbl" font-size="11" fill="#94a3b8">info.cern.ch</text>

    <!-- 1993 -->
    <circle cx="316" cy="125" r="11" fill="#f59e0b"/>
    <text x="316" y="100" class="yr" font-size="18" fill="#b45309">1993</text>
    <text x="316" y="156" class="lbl" font-size="13" fill="#334155">Mosaic</text>
    <text x="316" y="173" class="lbl" font-size="11" fill="#94a3b8">images + clicks</text>

    <!-- 2004 -->
    <circle cx="444" cy="125" r="11" fill="#6740e8"/>
    <text x="444" y="100" class="yr" font-size="18" fill="#4c1d95">2004</text>
    <text x="444" y="156" class="lbl" font-size="13" fill="#334155">Social web</text>
    <text x="444" y="173" class="lbl" font-size="11" fill="#94a3b8">2-way web</text>

    <!-- 2007 -->
    <circle cx="572" cy="125" r="11" fill="#58cc02"/>
    <text x="572" y="100" class="yr" font-size="18" fill="#377e06">2007</text>
    <text x="572" y="156" class="lbl" font-size="13" fill="#334155">Mobile web</text>
    <text x="572" y="173" class="lbl" font-size="11" fill="#94a3b8">the iPhone</text>

    <!-- Today -->
    <circle cx="700" cy="125" r="13" fill="#f59e0b"/>
    <text x="700" y="100" class="yr" font-size="17" fill="#b45309">Today</text>
    <text x="700" y="156" class="lbl" font-size="13" fill="#334155">Web apps</text>
    <text x="700" y="173" class="lbl" font-size="11" fill="#94a3b8">everywhere</text>
  </g>
</svg>
