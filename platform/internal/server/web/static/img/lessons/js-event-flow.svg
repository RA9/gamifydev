<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="JavaScript behaviour flow: a user event triggers JavaScript, which updates the page.">
  <defs>
    <style>
      .lbl { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 800; }
      .sub { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 700; }
    </style>
  </defs>
  <rect x="2" y="2" width="716" height="236" rx="24" fill="#f7f7fd" stroke="#e7e5ff" stroke-width="2"/>
  <text x="360" y="44" text-anchor="middle" class="lbl" font-size="22" fill="#475569">How JavaScript brings a page to life</text>

  <!-- Step 1 -->
  <rect x="46" y="86" width="170" height="110" rx="18" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="131" y="132" text-anchor="middle" font-size="34">👆</text>
  <text x="131" y="168" text-anchor="middle" class="sub" font-size="18" fill="#4c1d95">An event</text>
  <text x="131" y="186" text-anchor="middle" class="sub" font-size="13" fill="#6d28d9">(a click)</text>

  <!-- Arrow -->
  <text x="248" y="150" text-anchor="middle" class="lbl" font-size="34" fill="#94a3b8">→</text>

  <!-- Step 2 -->
  <rect x="276" y="86" width="170" height="110" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="361" y="132" text-anchor="middle" font-size="34">⚙️</text>
  <text x="361" y="168" text-anchor="middle" class="sub" font-size="18" fill="#14532d">JavaScript</text>
  <text x="361" y="186" text-anchor="middle" class="sub" font-size="13" fill="#15803d">runs your code</text>

  <!-- Arrow -->
  <text x="478" y="150" text-anchor="middle" class="lbl" font-size="34" fill="#94a3b8">→</text>

  <!-- Step 3 -->
  <rect x="506" y="86" width="170" height="110" rx="18" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="591" y="132" text-anchor="middle" font-size="34">✨</text>
  <text x="591" y="168" text-anchor="middle" class="sub" font-size="18" fill="#7c2d12">The page</text>
  <text x="591" y="186" text-anchor="middle" class="sub" font-size="13" fill="#c2410c">updates</text>
</svg>
