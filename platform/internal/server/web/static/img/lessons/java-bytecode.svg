<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Write once, run anywhere. App.java is compiled by javac into App.class bytecode. The same bytecode then runs on a JVM on Windows, macOS, or Linux.">
  <defs>
    <style>
      .lbl  { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 800; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
    </style>
    <marker id="ahj" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6740e8"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="716" height="316" rx="24" fill="#f7f7fd" stroke="#e7e5ff" stroke-width="2"/>
  <text x="360" y="42" text-anchor="middle" class="lbl" font-size="21" fill="#475569">Write once, run anywhere</text>

  <!-- source -->
  <rect x="44" y="74" width="150" height="80" rx="16" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="119" y="110" text-anchor="middle" class="mono" font-size="19" fill="#4c1d95">App.java</text>
  <text x="119" y="134" text-anchor="middle" class="lbl" font-size="12" fill="#7c6fb0">source code</text>

  <text x="230" y="104" text-anchor="middle" class="lbl" font-size="12" fill="#6740e8">javac</text>
  <line x1="198" y1="114" x2="256" y2="114" stroke="#6740e8" stroke-width="3" marker-end="url(#ahj)"/>

  <!-- bytecode -->
  <rect x="262" y="74" width="160" height="80" rx="16" fill="#6740e8"/>
  <text x="342" y="108" text-anchor="middle" class="mono" font-size="18" fill="#ffffff">App.class</text>
  <text x="342" y="132" text-anchor="middle" class="lbl" font-size="12" fill="#d8ccff">bytecode</text>

  <text x="470" y="104" text-anchor="middle" class="lbl" font-size="12" fill="#6740e8">JVM</text>
  <line x1="426" y1="114" x2="486" y2="114" stroke="#6740e8" stroke-width="3" marker-end="url(#ahj)"/>

  <!-- runs anywhere box -->
  <rect x="492" y="66" width="192" height="96" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="588" y="104" text-anchor="middle" class="mono" font-size="18" fill="#14532d">the JVM</text>
  <text x="588" y="130" text-anchor="middle" class="lbl" font-size="12" fill="#15803d">runs the bytecode</text>

  <!-- fan-out to OSes -->
  <line x1="588" y1="162" x2="180" y2="214" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#ahj)"/>
  <line x1="588" y1="162" x2="360" y2="214" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#ahj)"/>
  <line x1="588" y1="162" x2="540" y2="214" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#ahj)"/>

  <rect x="96" y="222" width="168" height="66" rx="14" fill="#ffffff" stroke="#e7e5ff" stroke-width="2"/>
  <text x="180" y="262" text-anchor="middle" class="lbl" font-size="18" fill="#475569">Windows</text>

  <rect x="276" y="222" width="168" height="66" rx="14" fill="#ffffff" stroke="#e7e5ff" stroke-width="2"/>
  <text x="360" y="262" text-anchor="middle" class="lbl" font-size="18" fill="#475569">macOS</text>

  <rect x="456" y="222" width="168" height="66" rx="14" fill="#ffffff" stroke="#e7e5ff" stroke-width="2"/>
  <text x="540" y="262" text-anchor="middle" class="lbl" font-size="18" fill="#475569">Linux</text>
</svg>
