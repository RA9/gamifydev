<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="The anatomy of an HTML element: opening tag, attribute, content, and closing tag.">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
      .lbl  { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 800; }
      .tag    { fill: #6740e8; }
      .attr   { fill: #b45309; }
      .value  { fill: #2d630c; }
      .content{ fill: #0f172a; }
      .muted  { fill: #64748b; }
    </style>
  </defs>

  <!-- Self-contained light panel so the diagram reads on light and dark cards -->
  <rect x="2" y="2" width="716" height="376" rx="24" fill="#f7f7fd" stroke="#e7e5ff" stroke-width="2"/>

  <text x="360" y="56" text-anchor="middle" class="lbl" font-size="22" fill="#475569">Anatomy of an HTML element</text>

  <!-- The element -->
  <text x="360" y="150" text-anchor="middle" class="mono" font-size="40">
    <tspan class="tag">&lt;a </tspan><tspan class="attr">href</tspan><tspan class="muted">=</tspan><tspan class="value">"/about"</tspan><tspan class="tag">&gt;</tspan><tspan class="content">About us</tspan><tspan class="tag">&lt;/a&gt;</tspan>
  </text>

  <!-- Legend -->
  <g class="lbl" font-size="20">
    <circle cx="120" cy="232" r="9" fill="#6740e8"/>
    <text x="140" y="239" fill="#334155">Opening &amp; closing <tspan font-weight="900" fill="#6740e8">tags</tspan> wrap the element</text>

    <circle cx="120" cy="276" r="9" fill="#b45309"/>
    <text x="140" y="283" fill="#334155"><tspan font-weight="900" fill="#b45309">Attribute</tspan> name — extra info about the element</text>

    <circle cx="120" cy="320" r="9" fill="#2d630c"/>
    <text x="140" y="327" fill="#334155">Attribute <tspan font-weight="900" fill="#2d630c">value</tspan> — in quotes</text>

    <circle cx="120" cy="360" r="9" fill="#0f172a"/>
    <text x="140" y="367" fill="#334155"><tspan font-weight="900" fill="#0f172a">Content</tspan> — what people actually see</text>
  </g>
</svg>
