<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="A class is a blueprint; objects are instances built from it. The Dog class defines fields (name) and a method (bark). From it you create individual Dog objects: Rex, Bella, and Max — each with its own name.">
  <defs>
    <style>
      .lbl  { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 800; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
    </style>
    <marker id="aho" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6740e8"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="716" height="316" rx="24" fill="#f7f7fd" stroke="#e7e5ff" stroke-width="2"/>
  <text x="360" y="42" text-anchor="middle" class="lbl" font-size="21" fill="#475569">A class is a blueprint — objects are built from it</text>

  <!-- class blueprint -->
  <rect x="44" y="84" width="220" height="170" rx="18" fill="#ede9fe" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="154" y="118" text-anchor="middle" class="lbl" font-size="15" fill="#7c6fb0">class (blueprint)</text>
  <text x="154" y="150" text-anchor="middle" class="mono" font-size="24" fill="#4c1d95">Dog</text>
  <line x1="74" y1="166" x2="234" y2="166" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="154" y="194" text-anchor="middle" class="mono" font-size="16" fill="#5b21b6">String name;</text>
  <text x="154" y="224" text-anchor="middle" class="mono" font-size="16" fill="#5b21b6">void bark()</text>

  <!-- new keyword arrows -->
  <text x="316" y="150" text-anchor="middle" class="mono" font-size="13" fill="#6740e8">new Dog()</text>
  <line x1="270" y1="120" x2="372" y2="120" stroke="#6740e8" stroke-width="2.5" marker-end="url(#aho)"/>
  <line x1="270" y1="169" x2="372" y2="169" stroke="#6740e8" stroke-width="2.5" marker-end="url(#aho)"/>
  <line x1="270" y1="218" x2="372" y2="218" stroke="#6740e8" stroke-width="2.5" marker-end="url(#aho)"/>

  <!-- objects -->
  <rect x="378" y="92" width="300" height="56" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="408" y="126" text-anchor="middle" class="lbl" font-size="22">🐕</text>
  <text x="520" y="125" text-anchor="middle" class="mono" font-size="17" fill="#14532d">name = "Rex"</text>

  <rect x="378" y="160" width="300" height="56" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="408" y="194" text-anchor="middle" class="lbl" font-size="22">🐕</text>
  <text x="524" y="193" text-anchor="middle" class="mono" font-size="17" fill="#14532d">name = "Bella"</text>

  <rect x="378" y="228" width="300" height="56" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="408" y="262" text-anchor="middle" class="lbl" font-size="22">🐕</text>
  <text x="520" y="261" text-anchor="middle" class="mono" font-size="17" fill="#14532d">name = "Max"</text>

  <text x="528" y="306" text-anchor="middle" class="lbl" font-size="14" fill="#15803d">objects (instances) — each with its own name</text>
</svg>
