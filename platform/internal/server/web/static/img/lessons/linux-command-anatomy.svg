<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="The anatomy of a command. In ls -l /home, ls is the command (what to do), -l is an option or flag (how to do it), and /home is the argument (what to do it to).">
  <defs>
    <style>
      .lbl  { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 800; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
    </style>
  </defs>
  <rect x="2" y="2" width="716" height="236" rx="24" fill="#f7f7fd" stroke="#e7e5ff" stroke-width="2"/>
  <text x="360" y="44" text-anchor="middle" class="lbl" font-size="21" fill="#475569">The anatomy of a command</text>

  <!-- terminal-ish bar holding the command -->
  <rect x="120" y="78" width="480" height="58" rx="14" fill="#1f2937"/>
  <text x="150" y="116" class="mono" font-size="26" fill="#a78bfa">ls</text>
  <text x="206" y="116" class="mono" font-size="26" fill="#4ade80">-l</text>
  <text x="262" y="116" class="mono" font-size="26" fill="#fbbf24">/home</text>
  <text x="138" y="116" class="mono" font-size="26" fill="#64748b">$</text>

  <!-- command -->
  <line x1="166" y1="140" x2="166" y2="172" stroke="#a78bfa" stroke-width="2.5"/>
  <rect x="96" y="172" width="150" height="48" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="171" y="194" text-anchor="middle" class="lbl" font-size="14" fill="#4c1d95">command</text>
  <text x="171" y="211" text-anchor="middle" class="lbl" font-size="11" fill="#7c6fb0">what to do</text>

  <!-- option -->
  <line x1="218" y1="140" x2="320" y2="172" stroke="#4ade80" stroke-width="2.5"/>
  <rect x="262" y="172" width="160" height="48" rx="12" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="342" y="194" text-anchor="middle" class="lbl" font-size="14" fill="#14532d">option (flag)</text>
  <text x="342" y="211" text-anchor="middle" class="lbl" font-size="11" fill="#15803d">how to do it</text>

  <!-- argument -->
  <line x1="296" y1="140" x2="540" y2="172" stroke="#fbbf24" stroke-width="2.5"/>
  <rect x="440" y="172" width="184" height="48" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text x="532" y="194" text-anchor="middle" class="lbl" font-size="14" fill="#92400e">argument</text>
  <text x="532" y="211" text-anchor="middle" class="lbl" font-size="11" fill="#b45309">what to do it to</text>
</svg>
