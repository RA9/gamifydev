<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="Full-stack architecture: the frontend in the browser talks over an API to the backend server, which reads and writes a database.">
  <defs>
    <style>
      .lbl  { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 800; }
      .sub  { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 700; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
    </style>
  </defs>
  <rect x="2" y="2" width="756" height="276" rx="24" fill="#f7f7fd" stroke="#e7e5ff" stroke-width="2"/>
  <text x="380" y="42" text-anchor="middle" class="lbl" font-size="22" fill="#475569">The full stack</text>

  <!-- Frontend -->
  <rect x="36" y="92" width="200" height="130" rx="18" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="136" y="124" text-anchor="middle" class="lbl" font-size="17" fill="#4c1d95">FRONTEND</text>
  <text x="136" y="150" text-anchor="middle" class="sub" font-size="13" fill="#6d28d9">runs in the browser</text>
  <text x="136" y="184" text-anchor="middle" class="mono" font-size="14" fill="#4c1d95">HTML · CSS · JS</text>
  <text x="136" y="206" text-anchor="middle" class="sub" font-size="12" fill="#6d28d9">what users see</text>

  <!-- API link -->
  <text x="300" y="142" text-anchor="middle" class="mono" font-size="20" fill="#94a3b8">⇄</text>
  <text x="300" y="118" text-anchor="middle" class="sub" font-size="13" fill="#475569">API</text>
  <text x="300" y="170" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8">HTTP · JSON</text>

  <!-- Backend -->
  <rect x="364" y="92" width="200" height="130" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="464" y="124" text-anchor="middle" class="lbl" font-size="17" fill="#14532d">BACKEND</text>
  <text x="464" y="150" text-anchor="middle" class="sub" font-size="13" fill="#15803d">runs on a server</text>
  <text x="464" y="184" text-anchor="middle" class="mono" font-size="14" fill="#14532d">Python · Node</text>
  <text x="464" y="206" text-anchor="middle" class="sub" font-size="12" fill="#15803d">logic &amp; rules</text>

  <!-- DB link -->
  <text x="628" y="142" text-anchor="middle" class="mono" font-size="20" fill="#94a3b8">⇄</text>

  <!-- Database -->
  <rect x="656" y="92" width="80" height="130" rx="18" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="696" y="150" text-anchor="middle" font-size="30">🗄️</text>
  <text x="696" y="186" text-anchor="middle" class="sub" font-size="12" fill="#7c2d12">Database</text>
</svg>
