<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:title" content="GamifyDev" />
    <meta
      property="og:description"
      content="GamifyDev is a platform to test your knowledge in web development."
    />
    <!-- <meta property="og:image" content="https://gamifydev.com/img/og.png" /> -->
    <meta property="og:url" content="https://gamifydev.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@gamifydev" />
    <meta name="twitter:creator" content="@gamifydev" />
    <meta
      name="twitter:title"
      content="GamifyDev is a platform to test your knowledge in web development."
    />
    <meta
      name="twitter:description"
      content="GamifyDev is a platform to test your knowledge in web development."
    />
    <!-- <meta name="twitter:image" content="https://gamifydev.com/img/og.png" /> -->
    <meta name="twitter:image:alt" content="GamifyDev" />
    <title>GamifyDev</title>
    <!-- <link rel="stylesheet" href="css/bulma.min.css" /> -->
    <!-- <link rel="stylesheet" href="css/main.css" /> -->
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="./css/tailwind.css" />
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          if (localStorage.getItem("gamifydev-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="min-h-full flex flex-col bg-gray-100"
    ondragstart="return false;"
    onselectstart="return false;"
    oncontextmenu="return false;"
  >
    <header
      class="sticky top-0 z-40 bg-gradient-to-r from-brand-600 to-brand-500 shadow-lg shadow-brand-900/10"
    >
      <nav class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8" aria-label="Top">
        <div class="flex h-16 items-center justify-between gap-4">
          <!-- Brand -->
          <a href="#" class="flex items-center gap-2 shrink-0 group">
            <img
              src="/images/logo-mark.svg"
              alt="GamifyDev"
              class="h-9 w-9 shrink-0 drop-shadow-sm transition-transform group-hover:rotate-6"
            />
            <span class="text-white font-extrabold text-xl tracking-tight"
              >Gamify<span class="text-brand-200">Dev</span></span
            >
          </a>

          <!-- Desktop nav -->
          <div class="hidden lg:flex items-center gap-8">
            <a href="#about" data-route="about" class="gd-nav-link">About</a>
            <a href="#test" data-route="test" class="gd-nav-link">Test Yourself</a>
            <a href="#progress" data-route="progress" class="gd-nav-link">Progress</a>
            <a href="#contact" data-route="contact" class="gd-nav-link">Contact</a>
          </div>

          <!-- Right cluster: HUD + theme + mobile toggle -->
          <div class="flex items-center gap-2 sm:gap-3">
            <div
              id="gd-hud"
              class="hidden items-center gap-2 rounded-full bg-white/15 px-3 py-1.5 backdrop-blur"
              aria-label="Your stats"
            >
              <span class="flex items-center gap-1.5 text-white font-extrabold text-sm">
                <svg class="w-4 h-4 text-orange-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg><span id="gd-hud-streak">0</span>
              </span>
              <span class="h-4 w-px bg-white/30"></span>
              <span class="flex items-center gap-1.5 text-white font-extrabold text-sm">
                <svg class="w-4 h-4 text-brand-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 13L2 9z"/><path d="M11 3 8 9l4 13 4-13-3-6M2 9h20"/></svg><span id="gd-hud-xp">0</span>
              </span>
            </div>

            <button
              onclick="toggleTheme()"
              aria-label="Toggle dark mode"
              class="grid h-10 w-10 place-items-center rounded-full bg-white/15 hover:bg-white/25 text-white leading-none transition-colors"
            >
              <span class="theme-toggle-icon"></span>
            </button>

            <button
              onclick="toggleMobileMenu()"
              aria-label="Open menu"
              aria-expanded="false"
              id="gd-menu-btn"
              class="lg:hidden grid h-10 w-10 place-items-center rounded-full bg-white/15 hover:bg-white/25 text-white transition-colors"
            >
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Mobile menu -->
        <div id="gd-mobile-menu" class="hidden lg:hidden pb-4">
          <div class="flex flex-col gap-1 pt-1">
            <a href="#about" data-route="about" onclick="closeMobileMenu()" class="gd-nav-link rounded-xl px-3 py-2.5 hover:bg-white/10">About</a>
            <a href="#test" data-route="test" onclick="closeMobileMenu()" class="gd-nav-link rounded-xl px-3 py-2.5 hover:bg-white/10">Test Yourself</a>
            <a href="#progress" data-route="progress" onclick="closeMobileMenu()" class="gd-nav-link rounded-xl px-3 py-2.5 hover:bg-white/10">Progress</a>
            <a href="#contact" data-route="contact" onclick="closeMobileMenu()" class="gd-nav-link rounded-xl px-3 py-2.5 hover:bg-white/10">Contact</a>
          </div>
        </div>
      </nav>
    </header>

    <div
      id="promptForUpdateModal"
      class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4"
    >
      <div class="gd-card max-w-md w-full text-center animate-pop-in">
        <div class="grid h-14 w-14 mx-auto mb-3 place-items-center rounded-2xl bg-brand-100 text-brand-600">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4M22 5h-4M4 17v2M5 18H3"/></svg>
        </div>
        <h2 class="text-2xl font-extrabold mb-2">New Update Available</h2>
        <p class="text-slate-600 mb-6">
          A fresh version of GamifyDev is ready. Update now to get the latest?
        </p>
        <div class="flex justify-center gap-3">
          <button id="cancelButton" class="gd-btn gd-btn-secondary">Later</button>
          <button id="updateButton" class="gd-btn gd-btn-primary">Update</button>
        </div>
      </div>
    </div>

    <main
      class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10"
      id="page-content"
    ></main>

    <footer class="mt-auto border-t border-slate-200/70 bg-white/50 backdrop-blur">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm text-slate-500"
      >
        <p class="flex items-center gap-2 font-bold">
          <img src="/images/logo-mark.svg" alt="GamifyDev" class="h-6 w-6 shrink-0" />
          GamifyDev
        </p>
        <p>Learn to code by building. &copy; 2023–2026 GamifyDev.</p>
      </div>
    </footer>
    <script src="./js/external/dexie.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/icons.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/tys.js"></script>
    <script src="./js/progress.js"></script>
    <script src="./js/about.js"></script>
    <script src="./js/contact.js"></script>
    <script src="./js/modules.js"></script>
    <script src="./js/home.js"></script>

    <script src="./index.js"></script>
  </body>
</html>
