<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-label="A typical semantic page layout: header and nav on top, a main area with a section and an aside, and a footer at the bottom.">
  <defs>
    <style>
      .lbl  { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 800; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
    </style>
  </defs>
  <rect x="2" y="2" width="716" height="436" rx="24" fill="#f7f7fd" stroke="#e7e5ff" stroke-width="2"/>
  <text x="360" y="40" text-anchor="middle" class="lbl" font-size="22" fill="#475569">A typical page layout</text>

  <!-- header -->
  <rect x="60" y="64" width="600" height="60" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="360" y="100" text-anchor="middle" class="mono" font-size="18" fill="#4c1d95">&lt;header&gt; — logo + nav</text>

  <!-- main: section + aside -->
  <rect x="60" y="136" width="430" height="220" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="275" y="164" text-anchor="middle" class="mono" font-size="16" fill="#14532d">&lt;main&gt; &gt; &lt;section&gt;</text>
  <rect x="84" y="180" width="382" height="22" rx="6" fill="#bbf7d0"/>
  <rect x="84" y="214" width="382" height="22" rx="6" fill="#bbf7d0"/>
  <rect x="84" y="248" width="260" height="22" rx="6" fill="#bbf7d0"/>
  <rect x="84" y="296" width="160" height="34" rx="10" fill="#377e06"/>
  <text x="164" y="319" text-anchor="middle" class="lbl" font-size="15" fill="#ffffff">Call to action</text>

  <rect x="506" y="136" width="154" height="220" rx="10" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="583" y="164" text-anchor="middle" class="mono" font-size="15" fill="#7c2d12">&lt;aside&gt;</text>
  <rect x="524" y="184" width="118" height="60" rx="8" fill="#fed7aa"/>
  <rect x="524" y="256" width="118" height="60" rx="8" fill="#fed7aa"/>

  <!-- footer -->
  <rect x="60" y="368" width="600" height="48" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="398" text-anchor="middle" class="mono" font-size="16" fill="#334155">&lt;footer&gt; — links + copyright</text>
</svg>
