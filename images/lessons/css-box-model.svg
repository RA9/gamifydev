<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-label="The CSS box model: from the outside in, margin, border, padding, and content.">
  <defs>
    <style>
      .lbl { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 800; }
    </style>
  </defs>
  <rect x="2" y="2" width="716" height="456" rx="24" fill="#f7f7fd" stroke="#e7e5ff" stroke-width="2"/>
  <text x="360" y="40" text-anchor="middle" class="lbl" font-size="22" fill="#475569">The CSS box model</text>

  <!-- margin -->
  <rect x="60" y="70" width="600" height="340" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="74" y="92" class="lbl" font-size="17" fill="#c2410c">margin</text>

  <!-- border -->
  <rect x="150" y="120" width="420" height="240" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="164" y="142" class="lbl" font-size="17" fill="#334155">border</text>

  <!-- padding -->
  <rect x="200" y="155" width="320" height="170" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="214" y="177" class="lbl" font-size="17" fill="#15803d">padding</text>

  <!-- content -->
  <rect x="250" y="190" width="220" height="100" rx="6" fill="#ddd6fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="360" y="247" text-anchor="middle" class="lbl" font-size="20" fill="#5b21b6">content</text>

  <text x="360" y="438" text-anchor="middle" class="lbl" font-size="16" fill="#94a3b8">Every element is a box made of these four layers</text>
</svg>
