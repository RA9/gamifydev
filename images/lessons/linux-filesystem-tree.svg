<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="The Linux filesystem is a single tree starting at the root slash. Under root are directories like home, etc, and usr. Inside home is your user folder you, which contains notes.txt and a projects directory.">
  <defs>
    <style>
      .lbl  { font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 800; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
    </style>
  </defs>
  <rect x="2" y="2" width="716" height="336" rx="24" fill="#f7f7fd" stroke="#e7e5ff" stroke-width="2"/>
  <text x="360" y="42" text-anchor="middle" class="lbl" font-size="21" fill="#475569">One tree, starting at the root /</text>

  <!-- connectors -->
  <g stroke="#cbd5e1" stroke-width="2.5" fill="none">
    <path d="M 360 96 L 360 120 L 150 120 L 150 150"/>
    <path d="M 360 120 L 360 150"/>
    <path d="M 360 120 L 570 120 L 570 150"/>
    <!-- home -> you -->
    <path d="M 150 192 L 150 216 L 150 240"/>
    <!-- you -> notes.txt, projects -->
    <path d="M 188 280 L 230 280 L 230 250 L 360 250 L 360 264"/>
    <path d="M 188 296 L 230 296 L 230 312 L 360 312 L 360 300"/>
  </g>

  <!-- root -->
  <rect x="324" y="66" width="72" height="34" rx="10" fill="#6740e8"/>
  <text x="360" y="89" text-anchor="middle" class="mono" font-size="18" fill="#ffffff">/</text>

  <!-- level 1 -->
  <rect x="98" y="150" width="104" height="42" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="150" y="177" text-anchor="middle" class="mono" font-size="16" fill="#4c1d95">home</text>

  <rect x="312" y="150" width="96" height="42" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="360" y="177" text-anchor="middle" class="mono" font-size="16" fill="#4c1d95">etc</text>

  <rect x="520" y="150" width="100" height="42" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="570" y="177" text-anchor="middle" class="mono" font-size="16" fill="#4c1d95">usr</text>

  <!-- you (home dir) -->
  <rect x="96" y="240" width="108" height="44" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="150" y="262" text-anchor="middle" class="mono" font-size="16" fill="#1e3a8a">you</text>
  <text x="150" y="278" text-anchor="middle" class="lbl" font-size="11" fill="#3b69c4">~ your home</text>

  <!-- files under you -->
  <rect x="300" y="264" width="140" height="38" rx="10" fill="#ffffff" stroke="#e7e5ff" stroke-width="2"/>
  <text x="370" y="289" text-anchor="middle" class="mono" font-size="14" fill="#475569">notes.txt</text>

  <rect x="300" y="300" width="140" height="34" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="370" y="323" text-anchor="middle" class="mono" font-size="14" fill="#4c1d95">projects</text>

  <text x="610" y="316" text-anchor="end" class="lbl" font-size="13" fill="#94a3b8">folders hold files and other folders</text>
</svg>
